# Render blueprint cho backend. Frontend ở Vercel, database ở Supabase — hai thứ
# đó không nằm trong file này; Render chỉ dựng API và cron nạp dữ liệu.
#
# Tạo service: Render Dashboard → New → Blueprint, trỏ vào repo. Render đọc file
# này, tạo/khai cả hai resource. Các biến `sync: false` là secret: Render không
# tự lấy từ git, phải nhập một lần ở lần deploy đầu.
#
# Vì sao không dùng plan free: instance free ngủ sau 30 phút không request, mà
# trang public của web gọi thẳng API khi render phía server — mỗi lượt wake là
# một trang chậm hoặc hỏng.

services:
  - type: web
    name: metaboard-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: .                       # install từ gốc repo; trỏ vào apps/api thì
                                     # @tftiq/shared không resolve được
    buildCommand: npm ci
    startCommand: npm run start --workspace @tftiq/api
    healthCheckPath: /api/health     # /api/health/ready là bản có chạm DB
    autoDeploy: true
    envVars:
      # ---- bắt buộc ----
      - key: NODE_ENV
        value: production            # tắt branch dev-only (reason ở /voice/status)
      - key: DATABASE_URL            # Supabase pooler, session mode :5432 — xem docs/DEPLOYMENT.md
        sync: false
      - key: ADMIN_EMAIL             # owner account for /admin (bootstrap only)
        sync: false
      - key: ADMIN_SEED_PASSWORD     # delete with ADMIN_EMAIL after first sign-in
        sync: false
      # ---- mặc định an toàn đã bật; ghi rõ để không ai quên ----
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_SECURE_COOKIES
        value: "true"
      - key: PG_POOL_MAX
        value: "6"                   # tổng server connection của pooler là hữu hạn
      - key: AUTH_WEB_ORIGIN         # https://<domain Vercel> — link email + OAuth redirect
        sync: false
      # ---- tính năng: tắt là site vẫn chạy, chỉ mất Coach AI / voice ----
      - key: ASSISTANT_ENABLED
        value: "true"
      # Paid pilot (#95): chỉ "enforce" mới bật session + quota/ledger. Giá trị ở đây là
      # giá trị blueprint áp lại mỗi lần deploy, nên nó cũng phải là thứ ta muốn chạy:
      # để "off", Render sẽ kéo dashboard về "off" ngay lần deploy kế tiếp (đã xảy ra
      # 2026-10-30 với commit 926de6a). Đổi cùng lúc với MEMBERSHIP_ENFORCEMENT trên Vercel.
      - key: MEMBERSHIP_ENFORCEMENT
        value: "enforce"
      - key: ASSISTANT_PROVIDER      # google | openai | openrouter (ollama không dùng được ở đây)
        value: "google"
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY    # STT + TTS (Flux, tiếng Việt)
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_PROVIDER        # deepgram | vieneu — đổi engine chính, không cần sửa code
        value: vieneu
      - key: VIENEU_TTS_URL
        value: https://api.vieneu.io/api
      - key: VIENEU_TTS_API_KEY
        sync: false
      - key: VIENEU_TTS_VOICE
        sync: false
      - key: VIENEU_TTS_PROBE_TIMEOUT_MS
        value: "6000"            # probe /v1/voices qua WAN
